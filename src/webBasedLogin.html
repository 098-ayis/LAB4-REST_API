<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login & Register</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f2f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 380px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

input, button {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-top: 8px;
    border-radius: 6px;
}

input {
    border: 1px solid #ccc;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.login-btn {
    background: #007bff;
    color: white;
}

.register-btn {
    background: #28a745;
    color: white;
}

.msg {
    font-size: 13px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN SECTION -->
    <div id="loginSection">
        <h2>Login</h2>
        <input type="text" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="login-btn" onclick="login()">Login</button>
        <div id="loginMsg" class="msg"></div>

        <p>
            Don't have an account?
            <a href="#" onclick="showRegister()">Register here</a>
        </p>
    </div>

    <!-- REGISTER SECTION (HIDDEN) -->
    <div id="registerSection" style="display:none;">
        <h2>Register</h2>

        <input type="text" id="regEmail" placeholder="Email">
        <input type="password" id="regPass" placeholder="Password">
        <input type="text" id="regFirstName" placeholder="First Name">
        <input type="text" id="regLastName" placeholder="Last Name">
        <input type="text" id="regContact" placeholder="Contact">

        <button class="register-btn" onclick="register()">Register</button>
        <div id="regMsg" class="msg"></div>

        <p>
            Already have an account?
            <a href="#" onclick="showLogin()">Login here</a>
        </p>
    </div>

</div>

<script>

    function showRegister() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("registerSection").style.display = "block";
}

function showLogin() {
    document.getElementById("registerSection").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
}
//REGISTER
function register() {
    const email = document.getElementById("regEmail").value;
    const pass = document.getElementById("regPass").value;
    const firstName = document.getElementById("regFirstName").value;
    const lastName = document.getElementById("regLastName").value;
    const contact = document.getElementById("regContact").value;



   fetch("http://localhost/LAB4-REST_API/src/register.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            user_email: email,
            user_pass: pass,
            first_name: firstName,
            last_name: lastName,
            contact: contact,
            $role: "user"
        })
    })
    .then(res => res.json())
    .then(data => {
        regMsg.innerText = data.message;
        regMsg.style.color = data.status === "success" ? "green" : "red";

        if (data.status === "success") {
            showLogin();
        }
    })
    .catch(() => {
        regMsg.innerText = "Server error";
        regMsg.style.color = "red";
    });
}

//LOGIN
function login() {
    const name = document.getElementById("loginEmail").value;
    const pass = document.getElementById("loginPass").value;

    fetch("http://localhost/LAB4-REST_API/src/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            user_email: name,
            user_pass: pass
        })
    })
    .then(res => res.json())
    .then(data => {

        loginMsg.innerText = data.message;
        loginMsg.style.color = data.status === "success" ? "green" : "red";

        /* REGISTER PROMPT */
        if (data.message === "User not found") {
            regMsg.innerText = "User not found. Please register first.";
            regMsg.style.color = "red";
        }

        /* REDIRECT */
        if (data.status === "success") {
            setTimeout(() => {
                window.location.href = "src/webBasedInventory.html";
            }, 800);
        }
    })
    .catch(() => {
        loginMsg.innerText = "Server error (check PHP)";
        loginMsg.style.color = "red";
    });
}
</script>

</body>
</html>
